# Plain message templates. Used when a rule's message writer is "template", and as the fallback
# when the model fails. Fields come from the structured payload built in code; missing fields show "-".
late_task_alert: "{severity_label}: {title} ({client_name}) is due {due}, status {status}. Owner {owner}. {link}"
exception_digest: "{client_name}: {metric_label} is {actual} against target {target} on {date}."
# A template can have a version for one severity: <template>.<severity>
ticket_no_reply: "No reply: ticket {ticket_id} for {client_name} has had no reply since {last_reply_at}. Subject: {subject}."
ticket_no_reply.never_replied: "Never replied: ticket {ticket_id} for {client_name} was opened {opened_at} and has had no reply. Subject: {subject}."
default: "{severity_label}: {item_key} for {client_name}."
access_blocked: "{severity_label}: {summary} ({client_name}). Owner {owner}."
access_blocked.locked_out: "Locked out: {people_blocked} people cannot work at {client_name}. {summary}. Owner {owner}."
access_blocked.expiring: "Login expiring {expires_at}: {summary} ({client_name}). Owner {owner}."
waiting_on_client: "Waiting on the client since {opened_at}: {summary} ({client_name}). {items_held} items, ${amount_usd} held. Owner {owner}."
unplanned_absence: "Unplanned absence: {member} ({role}, {client_name}) is not working today."
audit_overdue: "{severity_label}: audit finding {finding_id} for {client_name} was due {due}: {summary}. Owner {owner}."
