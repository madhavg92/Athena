# Plain message templates. Used when a rule's message writer is "template", and as the fallback
# when the model fails. Fields come from the structured payload built in code; missing fields show "-".
late_task_alert: "{severity_label}: {title} ({client_name}) is due {due}, status {status}. Owner {owner}. {link}"
exception_digest: "{client_name}: {metric} is {actual} against target {target} on {date}."
ticket_no_reply: "{severity_label}: ticket {ticket_id} for {client_name} has had no reply since {last_reply_at}. Subject: {subject}. {link}"
default: "{severity_label}: {item_key} for {client_name}."
