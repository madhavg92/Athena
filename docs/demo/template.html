<title>Athena Demo Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: a generic work-chat window (left: chats, right: the Athena conversation). Athena's messages are cards that propose one action. */
:root {
  --page: #e9ebf0;
  --frame: #ffffff;
  --rail: #f5f6f8;
  --ink: #1d2129;
  --muted: #6b7280;
  --line: #e3e5ea;
  --accent: #4b53bc;
  --accent-ink: #ffffff;
  --accent-soft: #eef0fb;
  --spark-a: #6d5dfc;
  --spark-b: #22b8cf;
  --late: #c4314b;
  --risk: #b86e00;
  --ok: #237b4b;
  --quote: #f6f7fb;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0f1115; --frame: #1b1d22; --rail: #16181c; --ink: #e8eaef; --muted: #9aa1ad; --line: #2b2e35;
    --accent: #8f95f2; --accent-ink: #14151a; --accent-soft: #262a46; --late: #f2788c; --risk: #f0ad4e; --ok: #6fd39b; --quote: #22252c; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #0f1115; --frame: #1b1d22; --rail: #16181c; --ink: #e8eaef; --muted: #9aa1ad; --line: #2b2e35;
  --accent: #8f95f2; --accent-ink: #14151a; --accent-soft: #262a46; --late: #f2788c; --risk: #f0ad4e; --ok: #6fd39b; --quote: #22252c; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 var(--font); }
button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 28px; display: grid; gap: 12px; }
.over { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.over select { background: var(--frame); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; color: var(--ink); }
.window { background: var(--frame); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-columns: 260px minmax(0, 1fr); height: min(760px, calc(100vh - 110px)); min-height: 520px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.06); }
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.rail h2 { font-size: 15px; font-weight: 600; margin: 0; padding: 16px 16px 10px; }
.chatrow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 14px; margin: 0 6px; border-radius: 8px; color: var(--muted); }
.chatrow.on { background: var(--frame); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.06); }
.chatrow b { display: block; font-weight: 600; color: var(--ink); font-size: 14px; }
.chatrow span { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; display: grid; place-items: center; padding: 0 5px; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; background: var(--line); color: var(--muted); }
.av.ai { background: conic-gradient(from 210deg, var(--spark-a), var(--spark-b), var(--spark-a)); color: #fff; }
.av.ai svg { width: 18px; height: 18px; }
.main { display: flex; flex-direction: column; min-width: 0; }
.head { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); }
.head b { font-size: 15px; }
.head span { display: block; font-size: 12.5px; color: var(--muted); }
.log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.day { align-self: center; font-size: 12px; color: var(--muted); }
.row { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; max-width: 640px; }
.row .av { width: 32px; height: 32px; font-size: 12px; }
.row.me { align-self: flex-end; grid-template-columns: minmax(0, 1fr); }
.meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.meta b { color: var(--ink); font-weight: 600; margin-right: 6px; }
.card { background: var(--frame); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; box-shadow: 0 1px 2px rgb(0 0 0 / 0.04); }
.card.late { border-left: 3px solid var(--late); } .card.risk { border-left: 3px solid var(--risk); } .card.info { border-left: 3px solid var(--accent); }
.card h3 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.4; text-wrap: balance; }
.card .why { margin: 0; color: var(--muted); }
.checked { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.checked svg { width: 13px; height: 13px; color: var(--spark-a); flex: none; }
.offer { margin: 2px 0 0; font-weight: 500; }
.quote.clip { max-height: 7.2em; overflow: hidden; cursor: pointer; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.quote { background: var(--quote); border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
textarea.quote { width: 100%; min-height: 110px; border: 1px solid var(--accent); resize: vertical; font: 13.5px/1.5 var(--font); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border-radius: 6px; padding: 6px 14px; border: 1px solid var(--line); background: var(--frame); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.done { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ok); }
.done svg { width: 14px; height: 14px; flex: none; }
.bubble { background: var(--quote); border-radius: 10px; padding: 9px 13px; overflow-wrap: anywhere; }
.row.me .bubble { background: var(--accent-soft); }
.bubble p { margin: 0; } .bubble p + p, .bubble ul + p, .bubble p + ul { margin-top: 6px; } .bubble ul { margin: 0; padding-left: 18px; }
.src { margin-top: 6px; font-size: 12px; color: var(--muted); }
.working { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.spark { width: 14px; height: 14px; color: var(--spark-a); animation: spin 2.4s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spark { animation: none; } }
.compose { border-top: 1px solid var(--line); padding: 12px 18px 14px; display: grid; gap: 8px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { border: 1px solid var(--line); background: var(--frame); border-radius: 14px; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.suggest button:hover { color: var(--ink); border-color: var(--accent); }
.box { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 8px; padding: 6px 6px 6px 12px; background: var(--frame); }
.box:focus-within { border-color: var(--accent); }
.box textarea { flex: 1; min-width: 0; border: 0; outline: none; resize: none; height: 24px; max-height: 120px; background: none; padding: 4px 0; }
.box button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 6px 14px; font-weight: 500; cursor: pointer; }
.box button:disabled { opacity: 0.5; cursor: default; }
@media (max-width: 760px) {
  .window { grid-template-columns: 1fr; height: calc(100vh - 90px); }
  .rail { display: none; }
}
</style>

<div class="wrap">
  <div class="over">
    <span>How Athena would look in your work chat. Illustration with made-up clients, people and numbers.</span>
    <label>Viewing as <select id="who"></select></label>
  </div>
  <div class="window">
    <aside class="rail" aria-label="Chats">
      <h2>Chat</h2>
      <div id="rail"></div>
    </aside>
    <section class="main">
      <div class="head"><div class="av ai" aria-hidden="true">SPARK</div><div><b>Athena</b><span>Your assistant · reads Smartsheet, Supaboard, CS Hub and SharePoint</span></div></div>
      <div class="log" id="log" aria-live="polite"></div>
      <form class="compose" id="form" autocomplete="off">
        <div class="suggest" id="suggest"></div>
        <div class="box"><label for="q" hidden>Message Athena</label><textarea id="q" placeholder="Ask Athena anything"></textarea><button id="send" type="submit">Send</button></div>
      </form>
    </section>
  </div>
</div>

<script>
const DATA = /*ASK_DATA*/null;
const SUGGEST = /*SUGGESTIONS*/null;
const CANNED = /*CANNED*/null;
const INBOX = /*INBOX*/null;
const OPENS_AT = /*OPENS_AT*/null;
const PROPOSALS = /*PROPOSALS*/null;
const DEMO = /*DEMO_DATA*/null;

const PEOPLE = {
  dm_am: { name: "DM One", email: "dm.one@fixture.local", role: "Delivery manager, Northwind Orthopedics" },
  hub_leader: { name: "Hub Leader Key", email: "hl.key@fixture.local", role: "Hub leader, Northwind and Bluefield" },
  csm: { name: "CSM One", email: "csm.one@fixture.local", role: "Client success, Northwind and Bluefield" },
  ba: { name: "BA One", email: "ba.one@fixture.local", role: "Business analyst, all clients" },
};
const SRC = { get_tasks: "smartsheet", get_task_history: "smartsheet", get_team: "smartsheet", get_metrics: "supaboard", get_denials: "supaboard",
  get_ar_aging: "supaboard", get_tickets: "cs_hub", get_client_activity: "cs_hub", search_documents: "sharepoint" };
const NOW = new Date(DATA.now);
const HOUR = 3600e3;
const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z" opacity=".7"/></svg>';
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>';
const state = loadState();
let person = "dm_am", sampleFn = null, liveTools = false, busy = false, editing = null;

function loadState() { try { return JSON.parse(localStorage.getItem("athena-agent-v4") || "{}"); } catch (_) { return {}; } }
function saveState() { try { localStorage.setItem("athena-agent-v4", JSON.stringify(state)); } catch (_) {} }
function mine() { return (state[person] ||= { done: {}, msgs: [], turns: [], inbox: [] }); }
function of(key) { return (state[key] ||= { done: {}, msgs: [], turns: [], inbox: [] }); }
function initials(name) { return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase(); }
function nowLabel() { return OPENS_AT[person].replace("Mon ", ""); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(iso) { return new Date(iso).toLocaleString("en-GB", { timeZone: "Asia/Kolkata", weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }); }
function personaOf(key) { return DATA.personas[DATA.people[PEOPLE[key].email].persona]; }
function scopeOf(key) { const role = personaOf(key).scope_role, me = PEOPLE[key].email; return Object.keys(DATA.clients).filter(c => (DATA.clients[c].roles[role] || "").toLowerCase() === me); }
function resolveClient(v) {
  const s = String(v || "").toLowerCase().trim(); if (!s) return null;
  for (const [k, c] of Object.entries(DATA.clients)) { const n = c.name.toLowerCase(); if (k === s || n === s || s.includes(n) || n.includes(s) || n.split(" ")[0] === s.split(" ")[0]) return k; }
  return null;
}
function oldest(rows) { return rows.reduce((m, r) => (!m || r._as_of < m ? r._as_of : m), null); }
function words(s) { return (String(s).toLowerCase().match(/[a-z0-9]+/g) || []).filter(w => w.length > 2); }
function since(days) { const d = new Date(NOW); d.setUTCDate(d.getUTCDate() - days); return d.toISOString().slice(0, 10); }

function makeTools(key, steps, redraw) {
  const persona = personaOf(key), scope = scopeOf(key);
  const clientParam = { type: "string", description: "Client name, e.g. Northwind Orthopedics" };
  function guard(name, input, label) {
    const src = SRC[name];
    if (src && !persona.sources.includes(src)) { steps.push({ name, text: `${label}: ${src} is not available to ${PEOPLE[key].name}`, refused: "source" }); redraw(); throw new Error(`refused: the ${src} source is not available to this person`); }
    const c = resolveClient(input.client);
    if (!c) { steps.push({ name, text: `${label}: unknown client "${input.client}"`, refused: "unknown" }); redraw(); throw new Error(`unknown client "${input.client}". Clients in scope: ${scope.map(k => DATA.clients[k].name).join(", ")}`); }
    if (!scope.includes(c)) { steps.push({ name, client: c, text: `${label} for ${DATA.clients[c].name}: not in ${PEOPLE[key].name}'s scope`, refused: "scope" }); redraw(); throw new Error(`refused: ${DATA.clients[c].name} is not in this person's scope`); }
    return c;
  }
  function done(name, c, label, records, sources, extra = {}) {
    const stale = sources.filter(s => s.as_of && NOW - new Date(s.as_of) > DATA.max_age_hours * HOUR);
    steps.push({ name, client: c, text: `${label} for ${DATA.clients[c].name}`, n: records.length, sources, stale });
    redraw();
    const out = { client: DATA.clients[c].name, ...extra, records, as_of: sources.map(s => `${s.name}: ${fmt(s.as_of)} IST`) };
    if (stale.length) out.warning = `Data is not current for ${stale.map(s => s.name).join(", ")}. Say "Data is not current" and give the as_of time.`;
    return out;
  }
  const T = (name, description, properties, required, fn) => ({ name, description, inputSchema: { type: "object", properties, required }, execute: fn });
  return [
    T("get_my_alerts", "This person's open Athena alerts right now: id, rule, severity, client, item, history, and whether they acknowledged, snoozed or marked it not useful.", {}, [], () => {
      const rows = (INBOX[key] || []).filter(i => i.type === "alert").map(a => ({ alert_id: a.alert_id, rule: a.rule, severity: a.severity, client: a.client, item: a.title, facts: a.facts,
        history: a.history.map(h => `${h.time} ${h.kind}`), your_action: null }));
      steps.push({ name: "get_my_alerts", text: `Read ${rows.length} open alerts`, n: rows.length, sources: [{ name: "athena.alerts", as_of: DATA.now }], stale: [] }); redraw();
      return { records: rows };
    }),
    T("get_tasks", "Open tasks for one client from Smartsheet: id, title, owner, due (IST), status, last update, late flag. Pass status (e.g. Complete) to filter.",
      { client: clientParam, status: { type: "string" } }, ["client"], input => {
        const c = guard("get_tasks", input, "Tasks");
        let rows = DATA.tasks.filter(r => r.client === c);
        rows = input.status ? rows.filter(r => r.status.toLowerCase() === String(input.status).toLowerCase()) : rows.filter(r => r.status !== "Complete");
        rows.sort((a, b) => (a.due < b.due ? -1 : 1));
        return done("get_tasks", c, "Tasks", rows.map(r => ({ task_id: r.task_id, title: r.title, owner: DATA.people[r.owner]?.name || r.owner, due: fmt(r.due),
          status: r.status, last_update: fmt(r.last_update), late: new Date(r.due) < NOW && r.status !== "Complete" })), [{ name: "smartsheet.tasks", as_of: oldest(DATA.tasks) }]);
      }),
    T("get_task_history", "Change history of a client's tasks (created, due date moved, reassigned, status changes), optionally for one task id. Use it to explain why a task is late.",
      { client: clientParam, task_id: { type: "string" } }, ["client"], input => {
        const c = guard("get_task_history", input, "Task history");
        const rows = DATA.task_history.filter(r => r.client === c && (!input.task_id || r.task_id.toLowerCase() === String(input.task_id).toLowerCase()));
        rows.sort((a, b) => (a.time < b.time ? -1 : 1));
        return done("get_task_history", c, "Task history" + (input.task_id ? ` (${input.task_id})` : ""), rows.slice(-40).map(r => ({ task_id: r.task_id, time: fmt(r.time), change: r.change,
          old: /^\d{4}-/.test(r.old || "") ? fmt(r.old) : r.old, new: /^\d{4}-/.test(r.new || "") ? fmt(r.new) : r.new, by: DATA.people[r.by]?.name || r.by })), [{ name: "smartsheet.task_history", as_of: oldest(DATA.task_history) }]);
      }),
    T("get_team", "The team on a client: member, role, FTE, who is on leave and until when, open items and utilisation %.",
      { client: clientParam }, ["client"], input => {
        const c = guard("get_team", input, "Team and workload");
        const rows = DATA.team.filter(r => r.client === c).map(({ _as_of, client, ...r }) => r);
        return done("get_team", c, "Team and workload", rows, [{ name: "smartsheet.team", as_of: oldest(DATA.team) }]);
      }),
    T("get_metrics", "Daily values and targets of one metric for a client from Supaboard, with its meaning and which way is better. Metrics: backlog, first_pass_rate, ar_days, denial_rate.",
      { client: clientParam, metric: { type: "string", enum: Object.keys(DATA.metrics) }, period: { type: "string", enum: ["latest", "last_7_days", "last_14_days", "last_30_days"] } }, ["client", "metric"], input => {
        const c = guard("get_metrics", input, "Metric");
        const metric = String(input.metric); if (!DATA.metrics[metric]) throw new Error(`unknown metric ${metric}`);
        const n = { last_7_days: 7, last_14_days: 14, last_30_days: 30 }[input.period] || 1;
        const rows = DATA.metric_rows.filter(r => r.client === c && r.metric === metric).sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-n);
        const avg = rows.length ? Math.round(rows.reduce((s, r) => s + r.actual, 0) / rows.length * 10) / 10 : null;
        return done("get_metrics", c, `${metric.replace(/_/g, " ")} (${input.period || "latest"})`, rows.map(r => ({ date: r.date, actual: r.actual, target: r.target })),
          [{ name: "supaboard.metrics", as_of: oldest(rows) }], { metric, meaning: DATA.metrics[metric].meaning, better: DATA.metrics[metric].better, average: avg });
      }),
    T("get_denials", "Claim denials for a client over a period, grouped by payer, reason (CARC code), payer_and_reason or week; with claims submitted and the denial rate.",
      { client: clientParam, period: { type: "string", enum: ["last_7_days", "last_14_days", "last_30_days", "last_60_days"] }, group_by: { type: "string", enum: ["payer", "reason", "payer_and_reason", "week"] } }, ["client"], input => {
        const c = guard("get_denials", input, "Denials");
        const days = { last_7_days: 7, last_14_days: 14, last_30_days: 30, last_60_days: 60 }[input.period] || 30;
        const by = ["payer", "reason", "payer_and_reason", "week"].includes(input.group_by) ? input.group_by : "payer";
        const from = since(days);
        const rows = DATA.denials.filter(r => r.client === c && r.date >= from);
        const claims = DATA.claims.filter(r => r.client === c && r.date >= from);
        const g = {};
        for (const r of rows) {
          const d = new Date(r.date + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
          const k = by === "payer" ? r.payer : by === "reason" ? `${r.reason_code} ${r.reason}` : by === "week" ? "week of " + d.toISOString().slice(0, 10) : `${r.payer} | ${r.reason_code} ${r.reason}`;
          g[k] = (g[k] || 0) + r.count;
        }
        const total = Object.values(g).reduce((a, b) => a + b, 0), submitted = claims.reduce((a, r) => a + r.submitted, 0);
        const recs = Object.entries(g).sort((a, b) => (by === "week" ? (a[0] < b[0] ? -1 : 1) : b[1] - a[1])).slice(0, 12).map(([k, v]) => ({ group: k, denials: v, share_pct: total ? Math.round(1000 * v / total) / 10 : 0 }));
        return done("get_denials", c, `Denials by ${by.replace(/_/g, " ")} (${days} days)`, recs, [{ name: "supaboard.denials", as_of: oldest(DATA.denials) }],
          { period_days: days, claims_submitted: submitted, denials: total, denial_rate_pct: submitted ? Math.round(10000 * total / submitted) / 100 : null });
      }),
    T("get_ar_aging", "Weekly AR aging for a client (USD): 0-30, 31-60, 61-90, over 90 days, and the over-90 share. Up to 8 weeks.",
      { client: clientParam, weeks: { type: "integer" } }, ["client"], input => {
        const c = guard("get_ar_aging", input, "AR aging");
        const n = Math.max(1, Math.min(8, Number(input.weeks) || 4));
        const rows = DATA.ar_aging.filter(r => r.client === c).sort((a, b) => (a.week_start < b.week_start ? -1 : 1)).slice(-n);
        return done("get_ar_aging", c, `AR aging (${n} weeks)`, rows.map(r => ({ week_start: r.week_start, total_usd: r.total, "0_30_usd": r["0_30"], "31_60_usd": r["31_60"],
          "61_90_usd": r["61_90"], over_90_usd: r.over_90, over_90_pct: Math.round(1000 * r.over_90 / r.total) / 10 })), [{ name: "supaboard.ar_aging", as_of: oldest(DATA.ar_aging) }]);
      }),
    T("get_tickets", "CS Hub tickets for one client (open and pending unless a status is given), with last reply time, and the client health score and trend.",
      { client: clientParam, status: { type: "string", enum: ["open", "pending", "closed"] } }, ["client"], input => {
        const c = guard("get_tickets", input, "Tickets and health");
        const t = DATA.tickets.filter(r => r.client === c && (input.status ? r.status === input.status : r.status !== "closed"));
        const h = DATA.health.find(x => x.client === c);
        const sources = [{ name: "cs_hub.tickets", as_of: oldest(DATA.tickets) }]; if (h) sources.push({ name: "cs_hub.health", as_of: h._as_of });
        return done("get_tickets", c, "Tickets and health", t.map(r => ({ ticket_id: r.ticket_id, subject: r.subject, status: r.status, priority: r.priority, opened: fmt(r.opened_at),
          last_reply: r.last_reply_at ? fmt(r.last_reply_at) : "no reply yet" })), sources, { health_score: h?.health_score, health_trend: h?.trend });
      }),
    T("get_client_activity", "The client activity log: meetings, escalations, commitments Anka made (with dates) and notes. No email or chat content.",
      { client: clientParam }, ["client"], input => {
        const c = guard("get_client_activity", input, "Client activity");
        const rows = DATA.activity.filter(r => r.client === c).sort((a, b) => (a.time < b.time ? -1 : 1));
        return done("get_client_activity", c, "Client activity", rows.map(r => ({ time: fmt(r.time), type: r.type, summary: r.summary, owner: DATA.people[r.owner]?.name || r.owner })),
          [{ name: "cs_hub.activity", as_of: oldest(DATA.activity) }]);
      }),
    T("search_documents", "Search approved SharePoint documents for a client (statement of work, escalation SOP, payer list). Up to 5 snippets.",
      { client: clientParam, words: { type: "string" } }, ["client", "words"], input => {
        const c = guard("search_documents", input, "Documents");
        const want = new Set(words(input.words));
        const hits = DATA.documents.filter(d => d.client === c).map(d => [words(d.title + " " + d.snippet).filter(w => want.has(w)).length, d]).filter(([n]) => n).sort((a, b) => b[0] - a[0]).slice(0, 5).map(([, d]) => d);
        return done("search_documents", c, `Documents matching "${input.words}"`, hits.map(d => ({ title: d.title, snippet: d.snippet })), hits.length ? [{ name: "sharepoint.documents", as_of: oldest(hits) }] : []);
      }),
    T("get_owner", "The people who own a client: hub leader, DM/AM, CSM, BA, CS lead.", { client: clientParam }, ["client"], input => {
      const c = guard("get_owner", input, "Owners");
      return done("get_owner", c, "Owners", [Object.fromEntries(Object.entries(DATA.clients[c].roles).map(([r, e]) => [r, DATA.people[e]?.name || e]))], [{ name: "owner_map", as_of: DATA.now }]);
    }),
    T("get_client_profile", "The client profile: specialty, services, contract turnaround, meeting rhythm, watch items.", { client: clientParam }, ["client"], input => {
      const c = guard("get_client_profile", input, "Client profile");
      return done("get_client_profile", c, "Client profile", [{ profile: DATA.clients[c].profile }], [{ name: "client_profile", as_of: DATA.now }]);
    }),
  ];
}

function finish(text, steps) {
  const data = steps.filter(s => s.n > 0), refused = steps.filter(s => s.refused);
  let answer = (text || "").trim();
  if (refused.length && !data.length) answer = refused.some(r => r.refused === "scope") ? "I cannot answer this. That client is not in your scope." : refused.some(r => r.refused === "source") ? "I cannot answer this. That data source is not available to you." : answer;
  else if (!data.length && !/^I (do not|don't) know/i.test(answer)) answer = "I don't know. " + (steps.length ? "I checked: " + [...new Set(steps.map(s => s.text))].join("; ") + "." : "No data source covers this question.");
  const stale = data.flatMap(s => s.stale || []);
  if (stale.length && !/data is not current/i.test(answer)) answer = `Data is not current (${stale.map(s => `${s.name} as of ${fmt(s.as_of)}`).join("; ")}).\n` + answer;
  const seen = new Set(), src = [];
  for (const s of data) for (const x of s.sources) if (!seen.has(x.name)) { seen.add(x.name); src.push(`- ${x.name}, as of ${fmt(x.as_of)}`); }
  return answer + (src.length ? "\n\nSources:\n" + src.join("\n") : "");
}


function renderText(text) {
  const [main, src] = String(text).split(/\n\nSources:\n/);
  const out = []; let list = null;
  for (const raw of main.replace(/\*\*/g, "").split("\n")) {
    const line = raw.trim(); if (!line) continue;
    if (/^[-•*] /.test(line)) { if (!list) { list = []; out.push(list); } list.push(`<li>${esc(line.slice(2))}</li>`); continue; }
    list = null; out.push(`<p>${esc(line.replace(/^#+ /, ""))}</p>`);
  }
  let html = out.map(x => Array.isArray(x) ? `<ul>${x.join("")}</ul>` : x).join("");
  if (src) {
    const names = { smartsheet: "Smartsheet", supaboard: "Supaboard", cs_hub: "CS Hub", sharepoint: "SharePoint", owner_map: "owner list", client_profile: "client profile", athena: "Athena" };
    const used = [...new Set(src.split("\n").filter(Boolean).map(l => names[l.replace(/^- /, "").split(/[.,]/)[0]] || l.split(/[.,]/)[0]))];
    const when = (src.match(/as of (.+)$/m) || [])[1];
    html += `<div class="src">From ${esc(used.join(", "))}${when ? `, ${esc(when.replace(/^\w+, /, ""))}` : ""}</div>`;
  }
  return html;
}


// ---------------------------------------------------------------- view
function cardHtml(p) {
  const d = mine().done[p.id];
  const from = p.needs && of("dm_am").done[p.needs]?.action === "send" ? `<div class="meta">${esc(PEOPLE.dm_am.name)} sent this request at ${esc(of("dm_am").done[p.needs].at)}</div>` : "";
  if (d) {
    const label = d.action === "send" ? `Sent to ${esc(p.action.to_name)} · ${esc(d.at)}` : d.action === "draft" ? `${esc(p.after)}` : `Not now · I'll check again later`;
    return `<div class="card ${p.tone}"><h3>${esc(p.headline)}</h3><div class="done">${CHECK}<span>${d.action === "send" ? label : label}</span></div>${d.text && d.action === "send" ? `<div class="quote">${esc(d.text)}</div>` : ""}</div>`;
  }
  const isEdit = editing === p.id;
  const text = mine().drafts?.[p.id] ?? p.action.text;
  return `<div class="card ${p.tone}">${from}
    <h3>${esc(p.headline)}</h3>
    <p class="why">${esc(p.why)}</p>
    <div class="checked">${SPARK}<span>Checked ${esc(p.checked.join(", "))}</span></div>
    <p class="offer">${esc(p.offer)}</p>
    ${isEdit ? `<label for="ed-${p.id}" hidden>Edit</label><textarea class="quote" id="ed-${p.id}">${esc(text)}</textarea>` : `<div class="quote ${text.length > 260 ? "clip" : ""}" ${text.length > 260 ? 'title="Show all" data-open="1"' : ""}>${esc(text)}</div>`}
    <div class="btns">
      <button class="btn primary" type="button" data-go="${p.id}">${esc(isEdit ? (p.action.kind === "send" ? "Send" : "Save") : p.action.label)}</button>
      ${isEdit ? `<button class="btn" type="button" data-cancel="1">Cancel</button>` : `<button class="btn" type="button" data-edit="${p.id}">Edit</button><button class="btn" type="button" data-skip="${p.id}">Not now</button>`}
    </div></div>`;
}
function row(who, time, inner) {
  const ai = who === "Athena";
  return `<div class="row"><div class="av ${ai ? "ai" : ""}" aria-hidden="true">${ai ? SPARK : esc(initials(who))}</div><div><div class="meta"><b>${esc(who)}</b>${esc(time)}</div>${inner}</div></div>`;
}
function draw() {
  const m = mine(), parts = [`<div class="day">Today</div>`];
  for (const msg of m.inbox) parts.push(row(msg.from, msg.at, `<div class="bubble"><p>${esc(msg.text)}</p></div>`));
  for (const p of PROPOSALS[person] || []) parts.push(row("Athena", p.time, cardHtml(p)));
  for (const msg of m.msgs) {
    if (msg.role === "me") parts.push(`<div class="row me"><div><div class="meta" style="text-align:right">${esc(msg.at || "")}</div><div class="bubble"><p>${esc(msg.text)}</p></div></div></div>`);
    else parts.push(row("Athena", msg.at || "", msg.pending ? `<div class="bubble"><div class="working"><svg class="spark" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"/></svg>${esc(msg.status || "Looking into it")}</div></div>`
      : `<div class="bubble">${msg.draft ? `<p style="white-space:pre-wrap">${esc(msg.text)}</p><div class="src">Draft · not sent</div>` : renderText(msg.text)}</div>`));
  }
  const log = document.getElementById("log");
  log.innerHTML = parts.join("");
  log.scrollTop = log.scrollHeight;
  for (const b of log.querySelectorAll("[data-go]")) b.addEventListener("click", () => go(b.dataset.go));
  for (const b of log.querySelectorAll("[data-edit]")) b.addEventListener("click", () => { editing = b.dataset.edit; draw(); document.getElementById("ed-" + editing)?.focus(); });
  for (const b of log.querySelectorAll("[data-skip]")) b.addEventListener("click", () => { mine().done[b.dataset.skip] = { action: "skip", at: nowLabel() }; saveState(); draw(); drawRail(); });
  for (const q of log.querySelectorAll("[data-open]")) q.addEventListener("click", () => { q.classList.remove("clip"); q.removeAttribute("data-open"); });
  for (const b of log.querySelectorAll("[data-cancel]")) b.addEventListener("click", () => { editing = null; draw(); });
  document.getElementById("suggest").innerHTML = m.msgs.length ? "" : (SUGGEST[person] || []).map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("");
  for (const b of document.querySelectorAll("#suggest [data-q]")) b.addEventListener("click", () => send(b.dataset.q));
  document.getElementById("send").disabled = busy;
}
function go(id) {
  const p = (PROPOSALS[person] || []).find(x => x.id === id), m = mine();
  const ed = document.getElementById("ed-" + id);
  const text = ed ? ed.value : (m.drafts?.[id] ?? p.action.text);
  if (editing === id && p.action.kind !== "send") { (m.drafts ||= {})[id] = text; editing = null; saveState(); draw(); return; }
  editing = null;
  if (p.action.kind === "send") {
    m.done[id] = { action: "send", at: nowLabel(), text };
    of(p.action.to).inbox.push({ from: PEOPLE[person].name, at: nowLabel(), text });
  } else {
    m.done[id] = { action: "draft", at: nowLabel() };
    try { navigator.clipboard?.writeText(text).catch(() => {}); } catch (_) {}
  }
  saveState(); draw(); drawRail();
}

function drawRail() {
  const open = (PROPOSALS[person] || []).filter(p => !mine().done[p.id]).length;
  const others = Object.entries(PEOPLE).filter(([k]) => k !== person).slice(0, 3);
  document.getElementById("rail").innerHTML =
    `<div class="chatrow on"><div class="av ai" aria-hidden="true">${SPARK}</div><div><b>Athena</b><span>${open ? `${open} thing${open > 1 ? "s" : ""} for you` : "All caught up"}</span></div>${open ? `<div class="badge">${open}</div>` : "<div></div>"}</div>` +
    others.map(([k, p]) => `<div class="chatrow"><div class="av" aria-hidden="true">${esc(initials(p.name))}</div><div><b>${esc(p.name)}</b><span>${esc(p.role.split(",")[0])}</span></div><div></div></div>`).join("") +
    `<div class="chatrow"><div class="av" aria-hidden="true">#</div><div><b>Northwind ops</b><span>Channel</span></div><div></div></div>`;
}

// ---------------------------------------------------------------- asking Athena
function instructions() {
  const p = PEOPLE[person], persona = personaOf(person);
  return [
    `You are Athena, a personal assistant in a work chat for ${p.name} (${p.role}) at Anka, a healthcare revenue-cycle company. Demo with made-up data.`,
    `Their clients: ${scopeOf(person).map(k => DATA.clients[k].name).join(", ")}. Their data: ${persona.sources.join(", ")}. It is ${OPENS_AT[person]} IST, Monday 05 Oct 2026.`,
    "Reply like a sharp colleague in chat: 1 to 3 short sentences, at most 3 short bullets. No headings, no bold, no preamble. Lead with the answer. Where useful, end with one concrete action you could take for them (a message to a manager, or a draft).",
    "Investigate 'why' questions with several tools in parallel (task history, team and leave, denials by payer and reason, client activity, AR aging). Use only tool results; never invent numbers, names or dates.",
    "If you cannot answer, say \"I don't know\" and what is missing. If a tool refuses (not their client or not their data), say so in one sentence. If data is old, say \"Data is not current\". Never give patient details. You only read data and draft; you never send anything to clients.",
  ].join("\n");
}
async function send(text) {
  text = String(text || "").trim(); if (!text || busy) return;
  const m = mine();
  m.msgs.push({ role: "me", text, at: nowLabel() });
  const draftAsk = /^draft\b/i.test(text);
  if (!(sampleFn && liveTools)) {
    const c = (CANNED?.[person] || []).find(x => x.q.toLowerCase() === text.toLowerCase());
    m.msgs.push({ role: "athena", at: nowLabel(), text: c && !/^I do not know\. I (could not|have no)/.test(c.answer) ? c.answer + (c.footer ? "\n\n" + c.footer : "") : "Open this page in Claude to ask Athena anything. Here you can try the cards above." });
    saveState(); draw(); return;
  }
  const bot = { role: "athena", pending: true, status: "Looking into it", at: nowLabel() };
  m.msgs.push(bot); busy = true; draw();
  const steps = [];
  const redraw = () => { const last = steps.at(-1); if (last) bot.status = `Checking ${last.text.charAt(0).toLowerCase() + last.text.slice(1)}`; if (m === mine()) draw(); };
  const input = [{ role: "user", content: instructions() + (draftAsk ? "\nThe user wants a draft for them to review and send themselves: under 100 words, start with 'To:' and 'Subject:'." : "") }, ...m.turns.slice(-6), { role: "user", content: text }];
  try {
    const { text: out } = await sampleFn(input, { tools: makeTools(person, steps, redraw), modelTier: "default" });
    Object.assign(bot, { pending: false, text: draftAsk ? out.trim() : finish(out, steps), draft: draftAsk });
    m.turns.push({ role: "user", content: text }, { role: "assistant", content: bot.text });
  } catch (e) {
    Object.assign(bot, { pending: false, text: { rate_limited: "Too many messages at once. Try again in a minute.", not_granted: "Athena needs permission to use Claude for live answers.", refused: "I can't help with that one." }[e?.code] || "Something went wrong. Try again." });
    if (["not_granted", "sampling_disabled", "tools_unavailable"].includes(e?.code)) liveTools = false;
  } finally { busy = false; saveState(); draw(); }
}

// ---------------------------------------------------------------- start
const sel = document.getElementById("who");
sel.innerHTML = Object.entries(PEOPLE).map(([k, p]) => `<option value="${k}">${esc(p.name)} · ${esc(p.role.split(",")[0])}</option>`).join("");
sel.addEventListener("change", () => { person = sel.value; editing = null; try { localStorage.setItem("athena-agent-person", person); } catch (_) {} drawRail(); draw(); });
document.getElementById("form").addEventListener("submit", ev => { ev.preventDefault(); const q = document.getElementById("q"); const v = q.value; q.value = ""; send(v); });
document.getElementById("q").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); document.getElementById("form").requestSubmit(); } });
try { const p = localStorage.getItem("athena-agent-person"); if (p && PEOPLE[p]) person = p; } catch (_) {}
if (location.hash && PEOPLE[location.hash.slice(1)]) person = location.hash.slice(1);
sel.value = person;
document.querySelector(".head .av").innerHTML = SPARK;
drawRail(); draw();
(async () => { try { sampleFn = await window.claude?.use?.("sample"); if (sampleFn) liveTools = !!(await sampleFn.limits().catch(() => null))?.tools; } catch (_) { sampleFn = null; } })();
</script>
