<style>
/* Layout: one chat, like a Teams conversation with Athena. Nothing else on screen. */
:root {
  --bg: #f2f4f6;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #687482;
  --line: #dde2e8;
  --accent: #245f8c;
  --accent-ink: #ffffff;
  --late: #b3362e;
  --risk: #a3650f;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0e141a; --surface: #18212b; --ink: #e6ebf0; --muted: #96a2af; --line: #2a3542; --accent: #6eaedb; --accent-ink: #0e141a; --late: #ef8379; --risk: #e3ad5f; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0e141a; --surface: #18212b; --ink: #e6ebf0; --muted: #96a2af; --line: #2a3542; --accent: #6eaedb; --accent-ink: #0e141a; --late: #ef8379; --risk: #e3ad5f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
button, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chat { max-width: 680px; height: 100%; margin: 0 auto; padding-inline: 16px; display: flex; flex-direction: column; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
header h1 { font-size: 17px; font-weight: 600; margin: 0; }
header h1 span { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
header select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; max-width: 60%; }
.log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-block: 8px 12px; }
.time { align-self: center; font-size: 12px; color: var(--muted); padding-block: 4px; }
.msg { max-width: 88%; padding: 9px 13px; border-radius: 14px; overflow-wrap: anywhere; }
.msg p { margin: 0; }
.msg p + p, .msg ul + p, .msg p + ul { margin-top: 6px; }
.msg ul { margin: 0; padding-left: 18px; }
.athena { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.late { background: var(--late); } .dot.risk { background: var(--risk); }
.src { margin-top: 6px; font-size: 12px; color: var(--muted); }
.typing { color: var(--muted); font-style: italic; }
.replies { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; margin-top: -2px; }
.replies button { background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 16px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
.replies button:hover { background: var(--accent); color: var(--accent-ink); }
.replies button:disabled { opacity: 0.4; cursor: default; background: none; color: var(--accent); }
form { display: flex; gap: 8px; padding-block: 10px 16px; border-top: 1px solid var(--line); }
textarea { flex: 1; min-width: 0; resize: none; height: 44px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 10px 16px; }
form button { border: 0; border-radius: 22px; padding: 0 18px; background: var(--accent); color: var(--accent-ink); font-weight: 500; cursor: pointer; }
form button:disabled { opacity: 0.5; cursor: default; }
.about { font-size: 12.5px; color: var(--muted); padding-top: 8px; display: flex; gap: 8px; align-items: center; }
.about button { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; }
</style>

<div class="chat">
  <header>
    <h1>Athena <span>demo · made-up data</span></h1>
    <label for="who" hidden>You are</label>
    <select id="who"></select>
  </header>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="about" id="about" hidden></div>
  <form id="form" autocomplete="off">
    <label for="q" hidden>Message Athena</label>
    <textarea id="q" placeholder="Message Athena"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

    T("get_my_alerts", "This person's open Athena alerts right now: id, rule, severity, client, item, history, and whether they acknowledged, snoozed or marked it not useful.", {}, [], () => {

        rows.sort((a, b) => (a.due < b.due ? -1 : 1));
        return done("get_tasks", c, "Tasks", rows.map(r => ({ task_id: r.task_id, title: r.title, owner: DATA.people[r.owner]?.name || r.owner, due: fmt(r.due),

        rows.sort((a, b) => (a.time < b.time ? -1 : 1));
        return done("get_task_history", c, "Task history" + (input.task_id ? ` (${input.task_id})` : ""), rows.slice(-40).map(r => ({ task_id: r.task_id, time: fmt(r.time), change: r.change,
          old: /^\d{4}-/.test(r.old || "") ? fmt(r.old) : r.old, new: /^\d{4}-/.test(r.new || "") ? fmt(r.new) : r.new, by: DATA.people[r.by]?.name || r.by })), [{ name: "smartsheet.task_history", as_of: oldest(DATA.task_history) }]);
      }),
    T("get_team", "The team on a client: member, role, FTE, who is on leave and until when, open items and utilisation %.",
      { client: clientParam }, ["client"], input => {
        const c = guard("get_team", input, "Team and workload");

    T("get_metrics", "Daily values and targets of one metric for a client from Supaboard, with its meaning and which way is better. Metrics: backlog, first_pass_rate, ar_days, denial_rate.",
      { client: clientParam, metric: { type: "string", enum: Object.keys(DATA.metrics) }, period: { type: "string", enum: ["latest", "last_7_days", "last_14_days", "last_30_days"] } }, ["client", "metric"], input => {

        const avg = rows.length ? Math.round(rows.reduce((s, r) => s + r.actual, 0) / rows.length * 10) / 10 : null;

    T("get_denials", "Claim denials for a client over a period, grouped by payer, reason (CARC code), payer_and_reason or week; with claims submitted and the denial rate.",

        const by = ["payer", "reason", "payer_and_reason", "week"].includes(input.group_by) ? input.group_by : "payer";
        const from = since(days);
        const rows = DATA.denials.filter(r => r.client === c && r.date >= from);
        const claims = DATA.claims.filter(r => r.client === c && r.date >= from);
        const g = {};
        for (const r of rows) {
          const d = new Date(r.date + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
          const k = by === "payer" ? r.payer : by === "reason" ? `${r.reason_code} ${r.reason}` : by === "week" ? "week of " + d.toISOString().slice(0, 10) : `${r.payer} | ${r.reason_code} ${r.reason}`;

    T("get_tickets", "CS Hub tickets for one client (open and pending unless a status is given), with last reply time, and the client health score and trend.",

          last_reply: r.last_reply_at ? fmt(r.last_reply_at) : "no reply yet" })), sources, { health_score: h?.health_score, health_trend: h?.trend });

function finish(text, steps) {
  const data = steps.filter(s => s.n > 0), refused = steps.filter(s => s.refused);
  let answer = (text || "").trim();
  if (refused.length && !data.length) answer = refused.some(r => r.refused === "scope") ? "I cannot answer this. That client is not in your scope." : refused.some(r => r.refused === "source") ? "I cannot answer this. That data source is not available to you." : answer;
  else if (!data.length && !/^I (do not|don't) know/i.test(answer)) answer = "I don't know. " + (steps.length ? "I checked: " + [...new Set(steps.map(s => s.text))].join("; ") + "." : "No data source covers this question.");
  const stale = data.flatMap(s => s.stale || []);
  if (stale.length && !/data is not current/i.test(answer)) answer = `Data is not current (${stale.map(s => `${s.name} as of ${fmt(s.as_of)}`).join("; ")}).\n` + answer;
  const seen = new Set(), src = [];
  for (const s of data) for (const x of s.sources) if (!seen.has(x.name)) { seen.add(x.name); src.push(`- ${x.name}, as of ${fmt(x.as_of)}`); }
  return answer + (src.length ? "\n\nSources:\n" + src.join("\n") : "");
}


function sevDot(s) { return s === "late" ? "late" : "risk"; }
function when(s) { return String(s || "").replace(/^04 Oct /, "yesterday ").replace(/^05 Oct /, "today ").replace(/^03 Oct /, "Sat "); }
function shortDue(a) { return a.facts.due ? `due ${when(a.facts.due)}` : a.facts.last_reply_at ? `no reply since ${when(a.facts.last_reply_at)}` : a.facts.opened_at ? `opened ${when(a.facts.opened_at)}, no reply yet` : ""; }
function shortText(s) { return String(s).replace(/\s*https?:\/\/\S+/g, "").trim(); }
function digestLine(l) {
  const m = l.replace(/^- /, "").match(/^(.+?): (.+?) is ([\d.]+) against target ([\d.]+)/);
  return m ? `${m[1].split(" ")[0]} ${m[2]} ${Math.round(Number(m[3]) * 10) / 10} (target ${Number(m[4])})` : l.replace(/^- /, "");
}
function listItems(alerts) {
  const shown = alerts.slice(0, 3);
  return `<ul>${shown.map(a => `<li><span class="dot ${sevDot(a.severity)}"></span>${esc(a.title)}, ${esc(shortDue(a))}</li>`).join("")}</ul>${alerts.length > 3 ? `<p>…and ${alerts.length - 3} more.</p>` : ""}`;
}

// Athena's proactive messages for this person, in the order they arrived today. Short.
function proactive(key) {
  const items = INBOX[key] || [], events = {};
  for (const i of items) {
    if (i.type === "alert") for (const h of i.history) (events[`${h.time}|${h.kind}`] ||= []).push(i);
    else (events[`${i.received}|${i.type}`] ||= []).push(i);
  }
  const out = [];
  for (const k of Object.keys(events).sort()) {
    const [time, kind] = k.split("|"), group = events[k];
    const client = [...new Set(group.map(a => (a.client || "").split(" ")[0]).filter(Boolean))].join(" and ");
    if (kind === "digest") {
      const lines = shortText(group[0].text).split("\n").filter(l => l.startsWith("- "));
      out.push({ time, kind, html: `<p>Morning. ${lines.length} number${lines.length === 1 ? " is" : "s are"} off target:</p><ul>${lines.slice(0, 3).map(l => `<li>${esc(digestLine(l))}</li>`).join("")}</ul>${lines.length > 3 ? `<p>…and ${lines.length - 3} more.</p>` : ""}`,
        replies: ["What should I act on first?"] });
    } else if (kind === "draft") {
      out.push({ time, kind, html: `<p>Your weekly report draft for ${esc(shortText(group[0].text).match(/for (.+?) \(/)?.[1] || "a client")} is ready to review.</p>`, replies: ["Draft the commentary"] });
    } else if (kind === "alert") {
      const tickets = group[0].rule === "R6";
      out.push({ time, kind, alerts: group.map(a => a.alert_id), html: `<p>${tickets ? `${group.length} ${client} ticket${group.length > 1 ? "s have" : " has"} had no reply for over a day:` : `${group.length} ${client} task${group.length > 1 ? "s need" : " needs"} you:`}</p>${listItems(group)}`,
        replies: ["On it", "Why?", "Later"] });
    } else if (kind === "reminder") {
      out.push({ time, kind, alerts: group.map(a => a.alert_id), html: `<p>Still open: ${esc(group[0].title)}${group.length > 1 ? ` and ${group.length - 1} more` : ""}.</p>`, replies: ["On it", "Why?", "Later"] });
    } else if (kind === "escalation") {
      out.push({ time, kind, alerts: group.map(a => a.alert_id), html: `<p>${group.length} ${client} item${group.length > 1 ? "s are" : " is"} still open after 4 hours, so ${group.length > 1 ? "they've" : "it's"} come to you:</p>${listItems(group)}`,
        replies: ["On it", "Why?", "Later"] });
    }
  }
  return out;
}

function log() { return (state[person] ||= { msgs: [], turns: [] }); }
function loadState() { try { return JSON.parse(localStorage.getItem("athena-chat-v3") || "{}"); } catch (_) { return {}; } }
function saveState() { try { localStorage.setItem("athena-chat-v3", JSON.stringify(state)); } catch (_) {} }

function renderText(text) {
  const [main, src] = String(text).split(/\n\nSources:\n/);
  const out = []; let list = null;
  for (const raw of main.replace(/\*\*/g, "").split("\n")) {
    const line = raw.trim(); if (!line) continue;
    if (/^[-•*] /.test(line)) { if (!list) { list = []; out.push(list); } list.push(`<li>${esc(line.slice(2))}</li>`); continue; }
    list = null; out.push(`<p>${esc(line.replace(/^#+ /, ""))}</p>`);
  }
  let html = out.map(x => Array.isArray(x) ? `<ul>${x.join("")}</ul>` : x).join("");
  if (src) {
    const names = { smartsheet: "Smartsheet", supaboard: "Supaboard", cs_hub: "CS Hub", sharepoint: "SharePoint", owner_map: "owner list", client_profile: "client profile", athena: "Athena" };
    const used = [...new Set(src.split("\n").filter(Boolean).map(l => names[l.replace(/^- /, "").split(/[.,]/)[0]] || l.split(/[.,]/)[0]))];
    const when = (src.match(/as of (.+)$/m) || [])[1];
    html += `<div class="src">From ${esc(used.join(", "))}${when ? `, ${esc(when.replace(/^\w+, /, ""))}` : ""}</div>`;
  }
  return html;
}

function draw() {
  const el = document.getElementById("log");
  const parts = [];
  let lastTime = null;
  const pro = proactive(person);
  const msgs = log().msgs;
  // proactive messages first (they happened earlier today), then the conversation
  for (const [n, m] of pro.entries()) {
    if (m.time !== lastTime) { parts.push(`<div class="time">${esc(m.time)}</div>`); lastTime = m.time; }
    parts.push(`<div class="msg athena">${m.html}</div>`);
    const answered = msgs.some(x => x.ref === n);
    parts.push(`<div class="replies">${m.replies.map(r => `<button type="button" data-ref="${n}" data-r="${esc(r)}" ${answered || busy ? "disabled" : ""}>${esc(r)}</button>`).join("")}</div>`);
  }
  if (pro.length) { parts.push(`<div class="time">${esc(OPENS_AT[person])} · now</div>`); }
  for (const m of msgs) {
    if (m.role === "me") parts.push(`<div class="msg me"><p>${esc(m.text)}</p></div>`);
    else parts.push(`<div class="msg athena">${m.pending ? `<p class="typing">${esc(m.status || "Looking into it…")}</p>` : m.draft ? `<p style="white-space:pre-wrap">${esc(m.text)}</p><div class="src">Draft. Not sent.</div>` : renderText(m.text)}</div>`);
  }
  if (!msgs.length) parts.push(`<div class="replies">${(SUGGEST[person] || []).map(q => `<button type="button" data-q="${esc(q)}" ${busy ? "disabled" : ""}>${esc(q)}</button>`).join("")}</div>`);
  el.innerHTML = parts.join("");
  for (const b of el.querySelectorAll("[data-r]")) b.addEventListener("click", () => quickReply(Number(b.dataset.ref), b.dataset.r));
  for (const b of el.querySelectorAll("[data-q]")) b.addEventListener("click", () => send(b.dataset.q));
  el.scrollTop = el.scrollHeight;
  document.getElementById("send").disabled = busy;
  const about = document.getElementById("about");
  if (focus) { about.hidden = false; about.innerHTML = `About: ${esc(focus.label)} <button type="button" id="clear">clear</button>`; document.getElementById("clear").addEventListener("click", () => { focus = null; draw(); }); }
  else about.hidden = true;
}

function say(text, extra = {}) { log().msgs.push({ role: "athena", text, ...extra }); saveState(); draw(); }

function quickReply(ref, reply) {
  const m = proactive(person)[ref];
  const alerts = (m.alerts || []).map(id => (INBOX[person] || []).find(a => a.alert_id === id)).filter(Boolean);
  focus = alerts.length ? { label: alerts.length > 1 ? `${alerts.length} items from ${m.time}` : alerts[0].title, alerts } : { label: m.kind, item: m };
  if (reply === "On it") {
    log().msgs.push({ role: "me", text: "On it", ref });
    say(`Got it. I'll hold reminders and escalation for 2 hours.`);
  } else if (reply === "Later") {
    log().msgs.push({ role: "me", text: "Later", ref });
    say(`OK. I'll bring ${alerts.length > 1 ? "these" : "it"} back at ${addMinutes(OPENS_AT[person], 120).slice(4)}.`);
  } else {
    send(reply === "Why?" ? (alerts.length > 1 ? "Why are these late, briefly?" : "Why is this late?") : reply, ref);
  }
}
function addMinutes(hhmm, mins) { const [d, t] = hhmm.split(" "); const [h, m] = t.split(":").map(Number); const x = h * 60 + m + mins; return `${d} ${String(Math.floor(x / 60) % 24).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; }

function instructions() {
  const p = PEOPLE[person], persona = personaOf(person);
  const about = focus?.alerts ? "The user is replying about these alerts: " + JSON.stringify(focus.alerts.map(a => ({ id: a.alert_id, item: a.title, client: a.client, severity: a.severity, facts: a.facts })))
    : focus?.item ? "The user is replying about this message: " + JSON.stringify(focus.item.html.replace(/<[^>]+>/g, " ")) : "";
  return [
    `You are Athena, a personal assistant in Microsoft Teams for ${p.name} (${p.role}) at Anka, a healthcare revenue-cycle company. Demo with made-up data.`,
    `Their clients: ${scopeOf(person).map(k => DATA.clients[k].name).join(", ")}. Their data: ${persona.sources.join(", ")}. It is ${OPENS_AT[person]} IST, Monday 05 Oct 2026.`,
    "Write like a sharp colleague replying in chat: 1 to 3 short sentences. If you must list, at most 3 short bullets. No headings, no bold, no preamble, no sign-off. Lead with the answer or the cause. Offer more detail only if useful, in a few words.",
    "Investigate with the tools before answering 'why' questions (several in parallel: task history, team and leave, denials by payer and reason, client activity, AR aging). Use only tool results; never invent numbers, names or dates.",
    "If you cannot answer, say \"I don't know\" and what is missing, in one sentence. If a tool refuses (not their client or not their data), say so in one sentence.",
    "If data is old, say \"Data is not current\" and when it is from. Never give patient details. You only read data; you can draft text for the user, never send it.",
    about,
  ].filter(Boolean).join("\n");
}

async function send(text, ref) {
  text = String(text || "").trim(); if (!text || busy) return;
  log().msgs.push({ role: "me", text, ref });
  const draft = /^draft\b/i.test(text);
  if (!(sampleFn && liveTools)) {
    const c = (CANNED?.[person] || []).find(x => x.q.toLowerCase() === text.toLowerCase());
    say(c && !/^I do not know\. I (could not|have no)/.test(c.answer) ? c.answer + (c.footer ? "\n\n" + c.footer : "") : "Open this page in Claude to talk to Athena. Here it can only show its messages.");
    return;
  }
  const bot = { role: "athena", pending: true, status: "Looking into it…" };
  log().msgs.push(bot); busy = true; draw();
  const steps = [];
  const redraw = () => { const last = steps.at(-1); if (last) bot.status = `Checking ${last.text.toLowerCase()}…`; draw(); };
  const turns = log().turns;
  const input = [{ role: "user", content: instructions() + (draft ? "\nThe user wants a draft. Write it for them to review and send themselves: under 100 words, start with 'To:' and 'Subject:'." : "") }, ...turns.slice(-6), { role: "user", content: text }];
  try {
    const { text: out } = await sampleFn(input, { tools: makeTools(person, steps, redraw), modelTier: "default" });
    Object.assign(bot, { pending: false, text: draft ? out.trim() : finish(out, steps), draft });
    turns.push({ role: "user", content: text }, { role: "assistant", content: bot.text });
  } catch (e) {
    Object.assign(bot, { pending: false, text: { rate_limited: "Too many messages at once. Try again in a minute.", not_granted: "Athena needs permission to use Claude for live answers.",
      refused: "I can't help with that one." }[e?.code] || "Something went wrong. Try again." });
    if (["not_granted", "sampling_disabled", "tools_unavailable"].includes(e?.code)) liveTools = false;
  } finally { busy = false; saveState(); draw(); }
}

function drawPicker() {
  const sel = document.getElementById("who");
  sel.innerHTML = Object.entries(PEOPLE).map(([k, p]) => `<option value="${k}" ${k === person ? "selected" : ""}>${esc(p.name)} · ${esc(p.role.split(",")[0])}</option>`).join("");
  sel.onchange = () => { person = sel.value; focus = null; try { localStorage.setItem("athena-chat-person", person); } catch (_) {} draw(); };
}

document.getElementById("form").addEventListener("submit", ev => { ev.preventDefault(); const q = document.getElementById("q"); const v = q.value; q.value = ""; send(v); });
document.getElementById("q").addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); document.getElementById("form").requestSubmit(); } });
try { const p = localStorage.getItem("athena-chat-person"); if (p && PEOPLE[p]) person = p; } catch (_) {}
if (location.hash && PEOPLE[location.hash.slice(1)]) person = location.hash.slice(1);
drawPicker(); draw();
(async () => { try { sampleFn = await window.claude?.use?.("sample"); if (sampleFn) liveTools = !!(await sampleFn.limits().catch(() => null))?.tools; } catch (_) { sampleFn = null; } })();
</script>
