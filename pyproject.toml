[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athena"
version = "0.1.0"
description = "Athena: the first build of Anka OS"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2",
  "pyyaml",
  "sqlalchemy>=2",
  "httpx",
  "typer",
  "croniter",
  "tzdata",
  "openai",
  "msal",
  "python-pptx",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
athena = "athena.cli:app"

[tool.setuptools.packages.find]
include = ["athena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
